name: Security & Quality Gates CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Code Formatting & Linting (Ruff)
        run: |
          ruff format --check src tests
          ruff check src tests

      - name: Strict Type Checking (Mypy)
        run: |
          mypy src tests

      - name: Static Application Security Testing (Bandit)
        run: |
          bandit -r src -c pyproject.toml

      - name: Test Suite with Coverage Gate (Pytest >= 90%)
        run: |
          pytest --cov=rbacapi --cov-report=term-missing --cov-fail-under=90
